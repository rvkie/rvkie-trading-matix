<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTM — Rvkie Trading Matix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ KEPALA APLIKASI ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-nama">RTM</span>
      <span class="brand-sub">Rvkie Trading Matix</span>
    </div>
    <div class="aset">
      <span class="aset-pasangan">BTC / USD</span>
      <span id="harga-sekarang" class="aset-harga">—</span>
      <span id="status-koneksi" class="status status-muat">memuat…</span>
    </div>
  </header>

  <!-- ============ GRAFIK ============ -->
  <main class="area-grafik">
    <div class="toolbar">
      <button id="tf-1m" class="tombol-tf aktif" type="button">1m</button>
      <button id="tf-5m" class="tombol-tf" type="button">5m</button>
    </div>
    <div class="kotak-grafik">
      <canvas id="grafik"></canvas>
    </div>
  </main>

  <!-- ============ PANEL KONTROL ============ -->
  <section class="panel-kontrol">

    <!-- Baris saldo -->
    <div class="baris-saldo">
      <span class="label-halus">Saldo Demo</span>
      <span id="saldo" class="nilai-saldo">10,000</span>
    </div>

    <!-- Baris transaksi sedang berjalan (tersembunyi bila kosong) -->
    <div id="kotak-jalan" class="kotak-jalan tersembunyi">
      <span id="info-jalan" class="info-jalan">—</span>
      <span id="hitung-mundur" class="hitung-mundur">—</span>
    </div>

    <!-- Pilihan nominal -->
    <div class="grup-pilih">
      <span class="label-halus">Nominal</span>
      <div id="grup-nominal" class="baris-tombol-pilih">
        <button class="tombol-pilih" data-nilai="10" type="button">10</button>
        <button class="tombol-pilih aktif" data-nilai="50" type="button">50</button>
        <button class="tombol-pilih" data-nilai="100" type="button">100</button>
        <button class="tombol-pilih" data-nilai="250" type="button">250</button>
      </div>
    </div>

    <!-- Pilihan durasi -->
    <div class="grup-pilih">
      <span class="label-halus">Durasi</span>
      <div id="grup-durasi" class="baris-tombol-pilih">
        <button class="tombol-pilih" data-nilai="30" type="button">30d</button>
        <button class="tombol-pilih aktif" data-nilai="60" type="button">1m</button>
        <button class="tombol-pilih" data-nilai="300" type="button">5m</button>
      </div>
    </div>

    <!-- Tombol arah -->
    <div class="baris-arah">
      <button id="tombol-naik" class="tombol-arah naik" type="button">▲ NAIK</button>
      <button id="tombol-turun" class="tombol-arah turun" type="button">▼ TURUN</button>
    </div>

    <p class="teks-halus">Menang: +80% nominal &middot; Kalah: &minus;nominal</p>
  </section>

  <!-- ============ DISCLAIMER ============ -->
  <footer class="disclaimer">Simulasi edukasi, bukan nasihat keuangan.</footer>

  <script src="app.js"></script>
</body>
</html>
